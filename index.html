<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World! | Memphis</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101010;
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
    }
    main {
      width: min(100% - 2.5rem, 72rem);
      margin: 0 auto;
      padding-block: clamp(2rem, 7vw, 5rem) 2rem;
    }
    header {
      border-top: 1px solid #777;
      padding-top: clamp(1.25rem, 4vw, 2.5rem);
      margin-bottom: clamp(1.5rem, 4vw, 2.75rem);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.65rem, 9vw, 7.5rem);
      letter-spacing: -.065em;
      line-height: 1.05;
    }
    p { margin: .85rem 0 0; color: #ddd; line-height: 1.5; }
    figure { margin: 0; }
    img { display: block; width: 100%; height: auto; }
    figcaption {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: .35rem 1.5rem;
      padding-block: .85rem;
      border-bottom: 1px solid #777;
      font-size: .85rem;
      line-height: 1.5;
      color: #ddd;
    }
    a { color: inherit; text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Hello World!</h1>
      <p>Welcome to my first Azure Storage website.</p>
    </header>
    <figure>
      <img src="picture.jpg" width="1800" height="1080" alt="Downtown Memphis skyline overlooking the Mississippi River in daylight">
      <figcaption>
        <strong>Memphis, Tennessee</strong>
        <span>Photo by <a href="https://commons.wikimedia.org/wiki/File:Memphis,_TN_skyline_along_the_Mississippi_River.jpg">Quintin Soloviev</a> · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> · Resized</span>
      </figcaption>
    </figure>
  </main>
</body>
</html>
